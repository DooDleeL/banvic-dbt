
sources:
  - name: erp_banvic
    description: ERP system with customers, employees, bills and transctions from Banvic.
    schema: erp_banvic
    tables:
      - name: localidades
        description: Table with city and state information.
        columns:
          - name: cod_localidade
            description: PK for localidades
            data_tests:
              - unique
              - not_null

      - name: clientes
        description: Table with customers information.
        columns:
          - name: cod_cliente
            description: PK for customers
            data_tests:
              - unique
              - not_null

      - name: agencias
        description: Table with agency details.
        columns:
          - name: cod_agencia
            description: PK for agencies
            data_tests:
              - unique
              - not_null

      - name: colaboradores
        description: Employees details.
        columns:
          - name: cod_colaborador
            description: PK for employees
            data_tests:
              - unique
              - not_null
      
      - name: colaborador_agencia
        description: Tabela de relacionamento entre colaboradores e agências, indicando quais colaboradores estão associados a quais agências.
        data_tests:
        - dbt_utils.unique_combination_of_columns:
            combination_of_columns:
              - cod_colaborador
              - cod_agencia
      - name: contas
        description: Tabela que registra as informações das contas bancárias dos clientes, incluindo número da conta, agência, saldo, tipo de conta e data de abertura.
        columns:
          - name: num_conta
            data_tests:
              - unique 
              - not_null
      - name: propostas_credito
        description: Tabela que armazena as propostas de crédito feitas aos clientes, incluindo dados como taxa de juros, valor da proposta, valor financiado, parcelas e status da proposta.
        columns:
          - name: cod_proposta
            data_tests:
              - unique 
              - not_null
      - name: transacoes
        description: Tabela que registra as transações realizadas nas contas dos clientes, incluindo tipo da transação, valor e data da transação.
        columns:
          - name: cod_transacao
            data_tests:
              - unique 
              - not_null